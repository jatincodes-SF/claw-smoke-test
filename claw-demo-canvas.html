<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claw Platform Demo Canvas</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px;
      min-height: 100vh;
    }
    header {
      text-align: center;
      margin-bottom: 16px;
      max-width: 800px;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #58a6ff, #bc8cff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p.subtitle {
      color: #8b949e;
      font-size: 1rem;
    }
    .canvas-container {
      position: relative;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      overflow: hidden;
    }
    canvas {
      display: block;
    }
    .controls {
      margin-top: 16px;
      display: flex;
      gap: 12px;
      align-items: center;
    }
    button {
      background: #238636;
      color: #ffffff;
      border: 1px solid rgba(240, 246, 252, 0.1);
      padding: 8px 16px;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    button:hover {
      background: #2ea043;
    }
    .info-tag {
      color: #8b949e;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Claw Platform Architecture & Workflow</h1>
    <p class="subtitle">Interactive HTML5 Canvas pitching What Claw is and How autonomous engineering works</p>
  </header>

  <div class="canvas-container">
    <canvas id="clawCanvas" width="1000" height="560"></canvas>
  </div>

  <div class="controls">
    <button id="toggleAnimBtn">Pause Animation</button>
    <span class="info-tag">Move your cursor over nodes to inspect system stages</span>
  </div>

  <script>
    const canvas = document.getElementById('clawCanvas');
    const ctx = canvas.getContext('2d');
    const toggleBtn = document.getElementById('toggleAnimBtn');

    let animating = true;
    let hoverNode = null;

    const nodes = [
      {
        id: 'input',
        title: '1. Task Specification',
        subtitle: 'Issue, Prompt, Goal',
        desc: 'Captures engineer intent, bug reports, or feature specifications.',
        x: 100,
        y: 200,
        w: 160,
        h: 90,
        color: '#58a6ff'
      },
      {
        id: 'claw',
        title: '2. Claw Orchestrator',
        subtitle: 'Developer Agent Engine',
        desc: 'Context retrieval, convention enforcement, planning & tool dispatch.',
        x: 320,
        y: 200,
        w: 170,
        h: 90,
        color: '#bc8cff'
      },
      {
        id: 'sandbox',
        title: '3. Isolated Sandbox',
        subtitle: 'Container Checkout & Exec',
        desc: 'Filesystem mutation and automated exec testing without touching git history.',
        x: 550,
        y: 110,
        w: 170,
        h: 90,
        color: '#3fb950'
      },
      {
        id: 'github',
        title: '4. GitHub Automation',
        subtitle: 'Branch, Commit & Push',
        desc: 'Atomic commit creation and verified branch ref updates via GitHub APIs.',
        x: 550,
        y: 290,
        w: 170,
        h: 90,
        color: '#f0883e'
      },
      {
        id: 'pr',
        title: '5. Pull Request',
        subtitle: 'Structured Summary & PR',
        desc: 'Real pull request opened with summary, changes, and sandbox verification evidence.',
        x: 780,
        y: 200,
        w: 160,
        h: 90,
        color: '#a371f7'
      }
    ];

    const particles = [
      { x: 260, y: 245, targetX: 320, targetY: 245, progress: 0.1, speed: 0.015, color: '#58a6ff' },
      { x: 490, y: 230, targetX: 550, targetY: 155, progress: 0.5, speed: 0.012, color: '#3fb950' },
      { x: 490, y: 260, targetX: 550, targetY: 335, progress: 0.8, speed: 0.012, color: '#f0883e' },
      { x: 720, y: 155, targetX: 780, targetY: 230, progress: 0.3, speed: 0.014, color: '#3fb950' },
      { x: 720, y: 335, targetX: 780, targetY: 260, progress: 0.6, speed: 0.014, color: '#f0883e' }
    ];

    function drawArrow(fromX, fromY, toX, toY, color) {
      ctx.beginPath();
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.moveTo(fromX, fromY);
      ctx.lineTo(toX, toY);
      ctx.stroke();

      // arrowhead
      const headlen = 8;
      const angle = Math.atan2(toY - fromY, toX - fromX);
      ctx.beginPath();
      ctx.fillStyle = color;
      ctx.moveTo(toX, toY);
      ctx.lineTo(toX - headlen * Math.cos(angle - Math.PI / 6), toY - headlen * Math.sin(angle - Math.PI / 6));
      ctx.lineTo(toX - headlen * Math.cos(angle + Math.PI / 6), toY - headlen * Math.sin(angle + Math.PI / 6));
      ctx.fill();
    }

    function drawPill(x, y, w, h, radius, fill, stroke) {
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, radius);
      ctx.fillStyle = fill;
      ctx.fill();
      ctx.strokeStyle = stroke;
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Background grid
      ctx.strokeStyle = '#21262d';
      ctx.lineWidth = 1;
      for (let x = 0; x < canvas.width; x += 30) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += 30) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }

      // Title & What / How Pitch in canvas header
      ctx.font = 'bold 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
      ctx.fillStyle = '#58a6ff';
      ctx.fillText('WHAT IS CLAW?', 40, 42);
      ctx.font = '13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
      ctx.fillStyle = '#8b949e';
      ctx.fillText('Autonomous AI engineering runtime delivering verified, production-grade Pull Requests safely.', 40, 62);

      ctx.font = 'bold 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
      ctx.fillStyle = '#bc8cff';
      ctx.fillText('HOW DOES IT WORK?', 40, 92);
      ctx.font = '13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
      ctx.fillStyle = '#8b949e';
      ctx.fillText('Dual-plane execution: sandbox verification followed by atomic GitHub version control updates.', 40, 112);

      // Connecting lines
      drawArrow(260, 245, 320, 245, '#30363d');
      drawArrow(490, 225, 550, 155, '#30363d');
      drawArrow(490, 265, 550, 335, '#30363d');
      drawArrow(720, 155, 780, 230, '#30363d');
      drawArrow(720, 335, 780, 260, '#30363d');

      // Animated Particles
      particles.forEach(p => {
        p.progress += p.speed;
        if (p.progress > 1) p.progress = 0;
        const curX = p.x + (p.targetX - p.x) * p.progress;
        const curY = p.y + (p.targetY - p.y) * p.progress;
        ctx.beginPath();
        ctx.arc(curX, curY, 4, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 8;
        ctx.fill();
        ctx.shadowBlur = 0;
      });

      // Nodes
      nodes.forEach(node => {
        const isHover = (hoverNode === node);
        const bg = isHover ? '#21262d' : '#161b22';
        const border = isHover ? node.color : '#30363d';

        drawPill(node.x, node.y, node.w, node.h, 10, bg, border);

        ctx.font = 'bold 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
        ctx.fillStyle = node.color;
        ctx.fillText(node.title, node.x + 12, node.y + 28);

        ctx.font = '11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
        ctx.fillStyle = '#8b949e';
        ctx.fillText(node.subtitle, node.x + 12, node.y + 48);

        ctx.font = '10px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
        ctx.fillStyle = '#c9d1d9';
        // Wrap brief desc
        const words = node.desc.split(' ');
        let line = '';
        let lineY = node.y + 66;
        for (let i = 0; i < words.length; i++) {
          const testLine = line + words[i] + ' ';
          if (ctx.measureText(testLine).width > node.w - 24 && i > 0) {
            ctx.fillText(line, node.x + 12, lineY);
            line = words[i] + ' ';
            lineY += 14;
            if (lineY > node.y + node.h - 6) break;
          } else {
            line = testLine;
          }
        }
        if (lineY <= node.y + node.h - 6) {
          ctx.fillText(line, node.x + 12, lineY);
        }
      });

      // Bottom highlights banner
      drawPill(40, 430, 920, 100, 8, '#0d1117', '#30363d');
      ctx.font = 'bold 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
      ctx.fillStyle = '#58a6ff';
      ctx.fillText('WHY CLAW MATTERS:', 60, 455);

      ctx.font = '12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
      ctx.fillStyle = '#c9d1d9';
      ctx.fillText('• High Reliability: Ephemeral container sandboxes run test suites and build verification prior to committing.', 60, 477);
      ctx.fillText('• Safe Isolation: Code changes remain strictly decoupled from GitHub until validation criteria pass.', 60, 497);
      ctx.fillText('• Complete Auditability: Generates human-readable PR descriptions with explicit testing logs and metrics.', 60, 517);

      if (animating) {
        requestAnimationFrame(render);
      }
    }

    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;

      hoverNode = nodes.find(node =>
        mouseX >= node.x && mouseX <= node.x + node.w &&
        mouseY >= node.y && mouseY <= node.y + node.h
      ) || null;

      if (!animating) render();
    });

    toggleBtn.addEventListener('click', () => {
      animating = !animating;
      toggleBtn.textContent = animating ? 'Pause Animation' : 'Resume Animation';
      if (animating) render();
    });

    render();
  </script>
</body>
</html>
